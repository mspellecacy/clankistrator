[package]
name = "clankistrator"
version = "0.1.0"
edition = "2024"

[dependencies]
rig-core = "0.32.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = "0.13"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
dotenvy = "0.15"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
log = "0.4"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-logger = { version = "0.18.1", features = ["tracing-support"] }
tokio-stream = "0.1"
rig-qdrant = "0.2.2"
